name: Bootstrap Hesabu source bundle
on:
  push:
    branches: [build/hesabu-ledger-mvp]
    paths: [hesabu-source.tar.gz]
permissions:
  contents: write
jobs:
  restore-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out build branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: build/hesabu-ledger-mvp
          persist-credentials: true
      - name: Restore normal source tree
        run: |
          tar -xzf hesabu-source.tar.gz -C .
          rm -f hesabu-source.tar.gz .github/workflows/bootstrap-source.yml
      - name: Install dependencies and verify
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build
      - name: Commit the complete source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add complete Hesabu MVP source"
          git push origin HEAD:build/hesabu-ledger-mvp
