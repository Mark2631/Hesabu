<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#075b4c">
<title>Hesabu · Offline</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f7f1;color:#123c32;font-family:"DM Sans",Inter,system-ui,sans-serif}.panel{width:min(440px,100%);padding:32px;border:1px solid #e2e9dc;border-radius:22px;background:#fff}.mark{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:#075b4c;color:#e7ef8e;font-weight:800;font-size:23px}.eyebrow{margin:24px 0 8px;color:#68806f;font-size:11px;font-weight:700;letter-spacing:.13em}h1{margin:0;font-size:29px;letter-spacing:-.05em}p{color:#697d72;font-size:14px;line-height:1.7}.note{margin-top:22px;padding:13px 15px;border-radius:12px;background:#f3f6e4;color:#486047;font-size:12px;line-height:1.6}
</style>
</head>
<body><main class="panel"><div class="mark">H</div><div class="eyebrow">HESABU WORKSPACE</div><h1>You’re offline.</h1><p>Your connection is unavailable. If you have opened this business on this device before, reopen Hesabu to view its last synced records.</p><div class="note">Saved business records are read-only while offline. Reconnect to record sales, payments, receipts and stock changes safely.</div></main></body>
</html>
